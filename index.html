<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guard Mode</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:16px}
button,input{font-size:18px;padding:12px;margin:6px;border-radius:8px;border:0}
button{background:#2e7d32;color:#fff}
#status{font-size:24px;margin:12px}
video{width:120px;border-radius:8px}
img{width:140px;margin:4px;border-radius:8px}
.cell{display:inline-block;font-size:12px}
.alarm{animation:flash .4s infinite alternate}
@keyframes flash{from{background:#111}to{background:#b00020}}
</style>
</head>
<body>
<h2>Guard Mode</h2>
<div id="status">Disarmed</div>
<video id="v" autoplay muted playsinline></video><br>
<button id="enroll" style="background:#1565c0">SAVE MY FACE</button><br>
<button id="arm">ARM (10s delay)</button><br>
<input id="pin" type="password" placeholder="PIN" inputmode="numeric">
<button id="dis" style="background:#c62828">DISARM</button>
<h3>Intruder photos</h3>
<button id="clear" style="background:#555;font-size:14px">Clear photos</button>
<div id="photos"></div>

<script>
const PIN = "1234";      // change this
const THRESHOLD = 4;     // lower = more sensitive
const MAX_PHOTOS = 20;
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';

let armed = false, siren = null, ctx = null, wl = null, last = null, stream = null;
let modelsReady = false, checking = false, ownerUntil = 0;
let owner = JSON.parse(localStorage.getItem('owner') || 'null');
let photos = JSON.parse(localStorage.getItem('photos') || '[]');
const $ = id => document.getElementById(id);
const say = t => $('status').textContent = t;
const wait = ms => new Promise(r => setTimeout(r, ms));

function showPhotos() {
  const box = $('photos');
  box.innerHTML = '';
  photos.forEach(p => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const img = new Image();
    img.src = p.img;
    const t = document.createElement('div');
    t.textContent = p.time;
    cell.append(img, t);
    box.append(cell);
  });
}
showPhotos();

$('clear').onclick = () => {
  photos = [];
  localStorage.removeItem('photos');
  showPhotos();
};

async function keepAwake() {
  try { wl = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (armed && document.visibilityState === 'visible') keepAwake();
});

async function startCam() {
  if (stream) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    $('v').srcObject = stream;
    return true;
  } catch (e) { say('Allow the camera first'); return false; }
}

async function loadModels() {
  if (modelsReady) return;
  say('Loading face model...');
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsReady = true;
}

async function getFace() {
  const r = await faceapi
    .detectSingleFace($('v'), new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 }))
    .withFaceLandmarks().withFaceDescriptor();
  return r ? r.descriptor : null;
}

async function isOwner() {
  if (!owner || !modelsReady) return false;
  const d = await getFace();
  if (!d) return false;
  const dist = Math.min(...owner.map(o => faceapi.euclideanDistance(d, o)));
  return dist < 0.5;
}

$('enroll').onclick = async () => {
  if (!(await startCam())) return;
  await loadModels();
  const list = [];
  for (let i = 0; i < 5; i++) {
    say('Look at the camera ' + (i + 1) + '/5');
    await wait(800);
    const d = await getFace();
    if (d) list.push(Array.from(d));
  }
  if (list.length < 3) { say('Face not clear. Try again in better light'); return; }
  owner = list;
  localStorage.setItem('owner', JSON.stringify(owner));
  say('Face saved (' + list.length + ' samples)');
};

$('arm').onclick = async () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (!(await startCam())) return;
  if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
    await DeviceMotionEvent.requestPermission();
  }
  if (owner) await loadModels();
  await keepAwake();
  let n = 10;
  say('Arming in ' + n + 's...');
  const t = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(t); armed = true; last = null; say('ARMED'); }
    else say('Arming in ' + n + 's...');
  }, 1000);
};

window.addEventListener('devicemotion', e => {
  if (!armed) return;
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const m = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  if (last !== null && Math.abs(m - last) > THRESHOLD) onMotion();
  last = m;
});

async function onMotion() {
  if (siren || checking || Date.now() < ownerUntil) return;
  if (!owner) { trigger(); return; }
  checking = true;
  say('Checking face...');
  for (let i = 0; i < 4; i++) {
    if (await isOwner()) {
      ownerUntil = Date.now() + 8000;
      checking = false;
      say('Owner recognised - ARMED');
      return;
    }
    await wait(500);
  }
  checking = false;
  trigger();
}

function photo() {
  const v = $('v');
  if (!v.videoWidth) return;
  const c = document.createElement('canvas');
  const s = 320 / v.videoWidth;
  c.width = 320;
  c.height = Math.round(v.videoHeight * s);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  photos.unshift({ img: c.toDataURL('image/jpeg', 0.6), time: new Date().toLocaleString() });
  photos = photos.slice(0, MAX_PHOTOS);
  try { localStorage.setItem('photos', JSON.stringify(photos)); } catch (e) {}
  showPhotos();
}

function trigger() {
  if (siren) return;
  say('INTRUDER!');
  document.body.classList.add('alarm');
  photo();
  setTimeout(photo, 2000);
  const o = ctx.createOscillator();
  o.type = 'sawtooth';
  o.connect(ctx.destination);
  o.start();
  let f = 600, up = true, c = 0;
  const iv = setInterval(() => {
    f += up ? 50 : -50;
    if (f >= 1400) up = false;
    if (f <= 600) up = true;
    o.frequency.value = f;
    if (++c % 8 === 0 && navigator.vibrate) navigator.vibrate(300);
  }, 30);
  siren = { o, iv };
}

$('dis').onclick = () => {
  if ($('pin').value !== PIN) { say('Wrong PIN'); return; }
  armed = false;
  document.body.classList.remove('alarm');
  if (siren) { siren.o.stop(); clearInterval(siren.iv); siren = null; }
  if (navigator.vibrate) navigator.vibrate(0);
  if (wl) { wl.release(); wl = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('pin').value = '';
  say('Disarmed');
};
</script>
</body>
</html>
